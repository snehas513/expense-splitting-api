services:
  db:
    image: mysql:8.4
    container_name: expense_splitting_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: expense_splitting_development
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails server -b 0.0.0.0"
    volumes:
      - ./backend:/app
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  mysql_data: